# Every push and pull request: the JVM tests and a debug build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's caches and the Gradle below, from run to run. setup-java's own cache
      # starts empty whenever a build file changes, a new nihilVersion included, and
      # then every dependency comes down again; here the last cache is the start and
      # only what changed is downloaded.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # Gradle, the wrapper's version, fetched apart from the wrapper: from
      # services.gradle.org (GitHub's releases behind it) with curl's patient
      # retries, or, when those are down, from Gradle's official Docker image on
      # Docker Hub. The cache above keeps it; later steps use $GRADLE.
      - name: Gradle
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          version=$(basename "$url" | sed -E 's/^gradle-(.+)-(bin|all)\.zip$/\1/')
          home="$HOME/.gradle/wrapper/ci/gradle-$version"
          if [ ! -x "$home/bin/gradle" ]; then
            mkdir -p "$(dirname "$home")"
            if curl -fsSL --retry 8 --retry-all-errors --retry-delay 20 --connect-timeout 20 -o "$RUNNER_TEMP/gradle.zip" "$url" &&
               unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"; then
              mv "$RUNNER_TEMP/gradle/gradle-$version" "$home"
            else
              echo "::warning::$url isn't answering: Gradle $version from its official Docker image instead"
              docker run --rm --user "$(id -u):$(id -g)" -v "$(dirname "$home"):/out" \
                "gradle:$version-jdk17" cp -r /opt/gradle "/out/gradle-$version"
            fi
          fi
          "$home/bin/gradle" --version
          echo "GRADLE=$home/bin/gradle" >> "$GITHUB_ENV"
          # Dependencies can come from GitHub's releases too (Maven Central sends
          # the Kotlin compiler there): when those are slow, Gradle waits two
          # minutes for an answer instead of 30 seconds, and when they fail (a 5xx,
          # a timeout) it tries 8 times instead of 3, waiting 2 s, then 4, 8... up
          # to about four minutes. Gradle reads max.tentatives; there is no
          # max.retries, which is why a 504 used to end the build in 30 seconds.
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=120000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=120000"
            echo "systemProp.org.gradle.internal.repository.max.tentatives=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> "$HOME/.gradle/gradle.properties"
      # The runner's Android SDK is used as is; Gradle installs anything missing.
      - run: $GRADLE --no-daemon test assembleDebug
      # The debug APK of this run, to install on a phone: the run's page, Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: nihil-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Android lint, as a report for now: it doesn't fail the build until what
      # it finds is fixed or put in a baseline; then drop continue-on-error.
      - name: Lint
        run: $GRADLE --no-daemon lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
