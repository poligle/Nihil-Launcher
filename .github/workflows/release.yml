# A tag like v0.2.0 builds the APK, signs it with your key and publishes a
# GitHub release with the APK and its SHA-256. See RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags, to compare with the last release.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's caches and the Gradle below, from run to run. setup-java's own cache
      # starts empty whenever a build file changes, a new nihilVersion included, and
      # then every dependency comes down again; here the last cache is the start and
      # only what changed is downloaded.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: The tag must be the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^val nihilVersion = \"$version\"" app/build.gradle.kts; then
            echo "::error::tag $GITHUB_REF_NAME, but nihilVersion in app/build.gradle.kts is not \"$version\""
            exit 1
          fi

      # versionCode comes from the version (app/build.gradle.kts): a version above the
      # last tag's is a versionCode above the last release's.
      - name: The version must be above the last tag's
        run: |
          code() {
            python3 -c 'import re, sys; m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?", sys.argv[1]); print(int(m[1]) * 1000000 + int(m[2]) * 10000 + int(m[3]) * 100 + int(m[4] or 99) if m else -1)' "$1"
          }
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ] && [ "$(code "$GITHUB_REF_NAME")" -le "$(code "$previous")" ]; then
            echo "::error::$GITHUB_REF_NAME is not above $previous"
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIHIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret NIHIL_KEYSTORE_BASE64 is missing (RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nihil-release.jks"
          echo "NIHIL_KEYSTORE=$RUNNER_TEMP/nihil-release.jks" >> "$GITHUB_ENV"

      # Gradle, the wrapper's version, fetched apart from the wrapper: from
      # services.gradle.org (GitHub's releases behind it) with curl's patient
      # retries, or, when those are down, from Gradle's official Docker image on
      # Docker Hub. The cache above keeps it; later steps use $GRADLE.
      - name: Gradle
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          version=$(basename "$url" | sed -E 's/^gradle-(.+)-(bin|all)\.zip$/\1/')
          home="$HOME/.gradle/wrapper/ci/gradle-$version"
          if [ ! -x "$home/bin/gradle" ]; then
            mkdir -p "$(dirname "$home")"
            if curl -fsSL --retry 8 --retry-all-errors --retry-delay 20 --connect-timeout 20 -o "$RUNNER_TEMP/gradle.zip" "$url" &&
               unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"; then
              mv "$RUNNER_TEMP/gradle/gradle-$version" "$home"
            else
              echo "::warning::$url isn't answering: Gradle $version from its official Docker image instead"
              docker run --rm --user "$(id -u):$(id -g)" -v "$(dirname "$home"):/out" \
                "gradle:$version-jdk17" cp -r /opt/gradle "/out/gradle-$version"
            fi
          fi
          "$home/bin/gradle" --version
          echo "GRADLE=$home/bin/gradle" >> "$GITHUB_ENV"
          # Dependencies can come from GitHub's releases too (Maven Central sends
          # the Kotlin compiler there): when those are slow, Gradle waits two
          # minutes for an answer instead of 30 seconds, and when they fail (a 5xx,
          # a timeout) it tries 8 times instead of 3, waiting 2 s, then 4, 8... up
          # to about four minutes. Gradle reads max.tentatives; there is no
          # max.retries, which is why a 504 used to end the build in 30 seconds.
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=120000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=120000"
            echo "systemProp.org.gradle.internal.repository.max.tentatives=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Test and build
        env:
          NIHIL_KEYSTORE_PASSWORD: ${{ secrets.NIHIL_KEYSTORE_PASSWORD }}
          NIHIL_KEY_ALIAS: ${{ secrets.NIHIL_KEY_ALIAS }}
          NIHIL_KEY_PASSWORD: ${{ secrets.NIHIL_KEY_PASSWORD }}
        run: $GRADLE --no-daemon test assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nihil-launcher-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # A tag with a dash (v0.2.0-rc.1) is a pre-release, to try before the real one.
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "NIHIL for Android $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
