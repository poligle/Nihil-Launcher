# A tag like v0.2.0 builds the APK, signs it with your key and publishes a
# GitHub release with the APK and its SHA-256. See RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: The tag must match versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::tag $GITHUB_REF_NAME, but versionName in app/build.gradle.kts is not \"$version\""
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIHIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret NIHIL_KEYSTORE_BASE64 is missing (RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nihil-release.jks"
          echo "NIHIL_KEYSTORE=$RUNNER_TEMP/nihil-release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          NIHIL_KEYSTORE_PASSWORD: ${{ secrets.NIHIL_KEYSTORE_PASSWORD }}
          NIHIL_KEY_ALIAS: ${{ secrets.NIHIL_KEY_ALIAS }}
          NIHIL_KEY_PASSWORD: ${{ secrets.NIHIL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nihil-launcher-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "NIHIL for Android $GITHUB_REF_NAME" --generate-notes
